<style>
  :root{
    --paper:#F6F6F6; --panel:#FFFFFF; --panel2:#F6F6F6; --line:#E4E4E4;
    --ink:#111111; --ink2:#5E5E5E; --ink3:#9B9B9B; --human:#C0392B;
    --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--f);letter-spacing:-.012em;word-break:keep-all;
       -webkit-font-smoothing:antialiased;padding:0 0 48px}
  button,input{font-family:var(--f)}
  .top{background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;height:60px;
       display:flex;align-items:center;justify-content:center}
  .top img{height:18px;width:auto;filter:brightness(0)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .hero{padding:28px 4px 18px}
  .hero .eyebrow{margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.2em;color:var(--ink3)}
  .hero h1{margin:0 0 10px;font-size:24px;font-weight:700;letter-spacing:-.045em;line-height:1.25}
  .hero p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.7}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:12px}

  /* 비밀번호 */
  .gate{max-width:360px;margin:40px auto 0;text-align:center}
  .gate .ic{margin:0 0 10px;font-size:28px}
  .gate h2{margin:0 0 8px;font-size:17px;font-weight:700}
  .gate p{margin:0;font-size:13px;color:var(--ink2);line-height:1.7}
  .pin-row{display:flex;gap:8px;margin-top:18px}
  .pin-row input{flex:1;min-width:0;font-size:18px;letter-spacing:.3em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px}
  .pin-row input:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .btn{padding:12px 18px;font-size:14px;font-weight:600;color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:10px;cursor:pointer}
  .btn.line{color:var(--ink);background:#fff}
  .pin-err{margin:10px 0 0 !important;color:var(--human) !important;font-size:12.5px !important}

  /* 요약 숫자 */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .kpi .l{margin:0;font-size:12px;color:var(--ink2)}
  .kpi .v{margin:6px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.03em}
  .kpi .v small{margin-left:2px;font-size:13px;font-weight:500;color:var(--ink2)}
  .kpi .s{margin:0;font-size:11.5px;color:var(--ink3)}

  /* 목록 */
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .head h2{margin:0;font-size:15.5px;font-weight:700}
  .head .note{font-size:11.5px;color:var(--ink3)}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tools input{font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .tools input[type=search]{flex:1;min-width:200px}
  .tools .btn{padding:9px 14px;font-size:13px}
  .dim{color:var(--ink3)}
  .tbl{margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px;text-align:left;white-space:nowrap}
  th{padding:9px 10px;font-size:11.5px;font-weight:500;color:var(--ink3);border-bottom:1px solid var(--ink)}
  td{padding:12px 10px;border-bottom:1px solid var(--line)}
  td.b{font-weight:600}
  td.sub{color:var(--ink3);font-variant-numeric:tabular-nums}
  .del{padding:5px 10px;font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:7px;cursor:pointer}
  .del:hover{color:var(--human);border-color:var(--human)}
  .empty{padding:40px 10px;text-align:center;font-size:13px;color:var(--ink3);line-height:1.7}
  .empty b{display:block;color:var(--ink2)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 18px;border-radius:10px;
         background:var(--ink);color:#fff;font-size:13px;z-index:10}
  .toast.err{background:var(--human)}
  .foot{margin-top:22px;text-align:center;font-size:11px;color:var(--ink3);line-height:1.7}
  @media (max-width:560px){ .kpis{grid-template-columns:1fr} }
</style>
</head>

<main class="wrap">
  <div class="hero">
    <p class="eyebrow">VISITOR LOG</p>
    <h1>방문 기록대장</h1>
    <p>방문 안전 서약서 제출 목록입니다. 수집일로부터 6개월이 지나면 자동 삭제됩니다.</p>
  </div>

  <section class="card gate" id="gate">
    <p class="ic">🔒</p>
    <h2>비밀번호를 입력하세요</h2>
    <p>개인정보가 담긴 게시판입니다.</p>
    <div class="pin-row">
      <input type="password" inputmode="numeric" maxlength="4" id="pin" placeholder="••••" autocomplete="off">
      <button class="btn" id="pinGo">확인</button>
    </div>
    <p class="pin-err" id="pinErr" hidden>비밀번호가 올바르지 않습니다.</p>
  </section>

  <div id="body" hidden>
    <div class="kpis" id="kpi"></div>
    <section class="card">
      <div class="head"><h2>방문 기록대장</h2><span class="note">수집일로부터 6개월 경과 시 자동 삭제</span></div>
      <div class="tools">
        <input type="search" id="q" placeholder="이름 · 업체명 · 연락처 · 차량번호 검색">
        <input type="date" id="from" title="제출일 시작"><span class="dim">~</span><input type="date" id="to" title="제출일 끝">
        <button class="btn line" id="btnReload">새로고침</button>
        <button class="btn" id="btnXlsx">엑셀 다운로드</button>
      </div>
      <div class="tbl" id="list"></div>
    </section>
  </div>

  <p class="foot">(주)시몬스 안전보건경영부</p>
</main>

<script>
(function () {
  var VISIT_LOG_PIN = '1004';      // 대시보드 방문 기록대장과 같은 비밀번호
  var VISIT_DEL_PIN = '8587';      // 방문 기록 삭제 시 한 번 더 묻는 비밀번호
  var VISIT_KEEP_MONTHS = 6;
  var ROWS = [];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDateTime(s) { var d = new Date(s); return ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function purgeDate(s) { var d = new Date(s); d.setMonth(d.getMonth() + VISIT_KEEP_MONTHS); return ymd(d); }
  function cutoff() { var d = new Date(); d.setMonth(d.getMonth() - VISIT_KEEP_MONTHS); return d; }
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  var db = window.supabase && window.SB_CONFIG
    ? window.supabase.createClient(SB_CONFIG.url, SB_CONFIG.anonKey, { auth: { persistSession: false } })
    : null;

  // 이 페이지는 읽기만 합니다. 6개월 지난 건은 서버(pg_cron)가 매일 지웁니다.
  function load() {
    if (!db) { toast('서버에 연결하지 못했습니다.', 'err'); return; }
    db.from('visit_pledges').select('*').gte('created_at', cutoff().toISOString())
      .order('created_at', { ascending: false }).limit(5000)
      .then(function (res) {
        if (res.error) throw res.error;
        ROWS = res.data || [];
        render();
      }).catch(function (e) {
        toast('불러오지 못했습니다: ' + ((e && e.message) || e), 'err');
        ROWS = []; render();
      });
  }

  function filtered() {
    var q = $('q').value.trim().toLowerCase().replace(/\s+/g, '');
    var from = $('from').value, to = $('to').value;
    return ROWS.filter(function (r) {
      var day = ymd(new Date(r.created_at));
      if (from && day < from) return false;
      if (to && day > to) return false;
      if (!q) return true;
      return [r.name, r.company, r.phone, r.car_no].join('|').toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1;
    });
  }

  function kpi(label, val, unit, sub) {
    return '<div class="kpi"><p class="l">' + label + '</p><p class="v">' + val + '<small>' + unit + '</small></p><p class="s">' + sub + '</p></div>';
  }

  function render() {
    var today = ymd(new Date()), month = today.slice(0, 7);
    var nToday = ROWS.filter(function (r) { return ymd(new Date(r.created_at)) === today; }).length;
    var nMonth = ROWS.filter(function (r) { return ymd(new Date(r.created_at)).slice(0, 7) === month; }).length;
    $('kpi').innerHTML =
      kpi('오늘 제출', nToday, '건', today) +
      kpi('이번 달 제출', nMonth, '건', month.replace('-', '년 ') + '월') +
      kpi('보관 중', ROWS.length, '건', '수집일로부터 ' + VISIT_KEEP_MONTHS + '개월 보관 후 자동 삭제');

    var rows = filtered();
    if (!rows.length) {
      $('list').innerHTML = '<div class="empty"><b>' + (ROWS.length ? '조건에 맞는 기록이 없습니다' : '제출된 서약서가 없습니다') + '</b></div>';
      return;
    }
    $('list').innerHTML = '<table><thead><tr><th>제출일시</th><th>이름</th><th>업체명</th><th>연락처</th><th>차량번호</th><th>동의</th><th>자동삭제 예정</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="sub">' + esc(fmtDateTime(r.created_at)) + '</td>' +
          '<td class="b">' + esc(r.name) + '</td><td>' + esc(r.company) + '</td>' +
          '<td>' + esc(r.phone) + '</td><td>' + esc(r.car_no) + '</td>' +
          '<td>' + (r.agree_privacy ? '동의' : '—') + '</td>' +
          '<td class="sub">' + esc(purgeDate(r.created_at)) + '</td>' +
          '<td><button class="del" data-del="' + esc(r.id) + '">삭제</button></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function deleteVisit(id) {
    var pin = prompt('이 방문 기록을 삭제하려면 삭제 비밀번호를 입력하세요.');
    if (pin === null) return;
    if (pin.trim() !== VISIT_DEL_PIN) { toast('삭제 비밀번호가 올바르지 않습니다.', 'err'); return; }
    db.from('visit_pledges').delete().eq('id', id)
      .then(function (res) { if (res.error) throw res.error; toast('삭제했습니다.'); load(); })
      .catch(function (e) { toast('삭제 실패: ' + ((e && e.message) || e), 'err'); });
  }

  function exportXlsx() {
    var rows = filtered();
    if (!rows.length) { toast('내려받을 기록이 없습니다.'); return; }
    var ws = XLSX.utils.json_to_sheet(rows.map(function (r) {
      return {
        '제출일시': fmtDateTime(r.created_at), '이름': r.name, '업체명': r.company, '연락처': r.phone,
        '차량번호': r.car_no, '수칙 서약': r.agree_rules ? '서약' : '',
        '개인정보 동의': r.agree_privacy ? '동의' : '', '자동삭제 예정일': purgeDate(r.created_at)
      };
    }));
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '방문 기록대장');
    XLSX.writeFile(wb, '방문기록대장_' + ymd(new Date()) + '.xlsx');
  }

  function tryPin() {
    var el = $('pin');
    if (el.value.trim() === VISIT_LOG_PIN) {
      $('gate').hidden = true;
      $('body').hidden = false;
      render();
      load();
    } else {
      $('pinErr').hidden = false;
      el.value = ''; el.focus();
    }
  }

  $('pinGo').onclick = tryPin;
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPin(); });
  $('q').addEventListener('input', render);
  $('from').addEventListener('change', render);
  $('to').addEventListener('change', render);
  $('btnReload').onclick = load;
  $('btnXlsx').onclick = exportXlsx;
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]');
    if (b) deleteVisit(b.getAttribute('data-del'));
  });
  $('pin').focus();
})();
</script>
</body>
</html>
